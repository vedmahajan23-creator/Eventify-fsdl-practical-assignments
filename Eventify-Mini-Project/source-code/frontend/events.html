<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- 📱 THIS LINE FIXES THE MOBILE VIEW (DIRECT ACCESS) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Explore Events | Eventify</title>
    
    <!-- Modern Styling & Animations -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        :root { --accent: #00f2fe; }
        body { 
            font-family: 'Poppins', sans-serif; 
            background: #0f172a; 
            color: white; 
            min-height: 100vh; 
            overflow-x: hidden; 
        }
        /* Animated Background Gradient */
        .bg-animate {
            background: linear-gradient(-45deg, #0f172a, #1e1b4b, #312e81, #0f172a);
            background-size: 400% 400%; 
            animation: gradient 15s ease infinite; 
            position: fixed; width: 100%; height: 100%; z-index: -1;
        }
        @keyframes gradient { 
            0% { background-position: 0% 50%; } 
            50% { background-position: 100% 50%; } 
            100% { background-position: 0% 50%; } 
        }
        .glass-card { 
            background: rgba(255, 255, 255, 0.05); 
            backdrop-filter: blur(15px); 
            border: 1px solid rgba(255, 255, 255, 0.1); 
            border-radius: 24px; 
            transition: all 0.4s ease; 
        }
        .glass-card:hover { 
            transform: translateY(-12px); 
            border-color: var(--accent); 
            box-shadow: 0 20px 40px rgba(0, 242, 254, 0.2); 
        }
        .text-neon { color: var(--accent); text-shadow: 0 0 10px rgba(0, 242, 254, 0.5); }
        .orbitron { font-family: 'Orbitron', sans-serif; }
        
        /* Webkit fix for mobile search bars */
        input { -webkit-appearance: none; appearance: none; border-radius: 100px; }
    </style>
</head>
<body>
    <div class="bg-animate"></div>

    <!-- Navigation (Mobile Responsive) -->
    <nav class="p-4 md:p-6 flex justify-between items-center max-w-7xl mx-auto">
        <h1 class="orbitron text-xl md:text-2xl font-bold tracking-widest text-neon">EVENTIFY</h1>
        <div class="space-x-4 md:space-x-8 text-[10px] md:text-base flex items-center">
            <a href="index.html" class="hover:text-cyan-400 transition">Register</a>
            <a href="events.html" class="text-cyan-400 border-b-2 border-cyan-400 pb-1">Events</a>
            <a href="admin.html" class="px-3 py-1 md:px-5 md:py-2 glass-card rounded-full hover:bg-white hover:text-black transition">Admin</a>
        </div>
    </nav>

    <!-- Header & Search (Mobile Centered) -->
    <header class="text-center mt-8 md:mt-12 mb-10 md:mb-16 px-4 animate__animated animate__fadeIn">
        <h2 class="text-3xl md:text-5xl font-bold orbitron mb-4">Upcoming <span class="text-neon text-2xl md:text-5xl">Events</span></h2>
        <p class="text-gray-400 max-w-xl mx-auto mb-6 text-xs md:text-sm">Explore tech fests, workshops, and seminars powered by AWS.</p>

        <!-- 🔍 SEARCH BAR COMPONENT -->
        <div class="max-w-md mx-auto relative px-2">
            <i class="fas fa-search absolute left-6 top-4 text-gray-400"></i>
            <input type="text" id="searchInput" onkeyup="searchEvents()" 
                placeholder="Find an event..." 
                class="w-full pl-12 pr-4 py-3 rounded-full bg-white/10 border border-white/20 outline-none text-white placeholder-gray-500 focus:border-cyan-400 transition text-sm">
        </div>
    </header>

    <!-- Events Grid (Responsive: 1 column mobile, 2 tablet, 3 laptop) -->
    <div id="eventsGrid" class="max-w-7xl mx-auto px-4 md:px-6 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 md:gap-8 pb-20">
        <div class="col-span-full text-center py-20 text-gray-500 animate-pulse">
            <i class="fas fa-spinner fa-spin text-4xl mb-4"></i>
            <p class="orbitron tracking-widest text-xs md:text-sm">Scanning AWS Cloud for Events...</p>
        </div>
    </div>

    <script>
        // --- CHANGE THIS TO YOUR EC2 IP ---
        const API_BASE = "http://Eventify-ALB-544014946.eu-north-1.elb.amazonaws.com"; 
        let allEvents = []; 

        async function loadEvents() {
            try {
                const res = await fetch(`${API_BASE}/events`);
                allEvents = await res.json();
                renderEvents(allEvents); 
            } catch (err) {
                document.getElementById('eventsGrid').innerHTML = '<p class="col-span-full text-center text-red-400">Failed to connect to EC2.</p>';
            }
        }

        function renderEvents(eventsList) {
            const grid = document.getElementById('eventsGrid');
            grid.innerHTML = ''; 

            if (eventsList.length === 0) {
                grid.innerHTML = '<p class="col-span-full text-center text-gray-500 mt-10">No events found matching your search. 🔍</p>';
                return;
            }

            eventsList.forEach((event, index) => {
                const imageUrl = event.image_url || 'https://images.unsplash.com/photo-1517245386807-bb43f82c33c4?auto=format&fit=crop&w=500&q=80';
                
                grid.innerHTML += `
                    <div class="glass-card overflow-hidden animate__animated animate__fadeInUp">
                        <!-- Use the real image from Database -->
                        <div class="h-56 md:h-64 w-full bg-cover bg-center" style="background-image: url('${imageUrl}')"></div>
                        
                        <div class="p-6">
                            <span class="bg-cyan-500/20 text-cyan-300 text-[10px] font-bold px-3 py-1 rounded-full orbitron tracking-widest uppercase">Tech Fest</span>
                            <h3 class="text-xl font-bold mt-3 mb-2">${event.title}</h3>
                            <div class="flex items-center text-gray-400 text-sm mb-6">
                                <i class="far fa-calendar-alt mr-2 text-neon text-xs"></i>
                                <span class="text-xs md:text-sm">${new Date(event.event_date).toLocaleDateString('en-GB')}</span>
                            </div>
                            <a href="index.html?event_id=${event.id}" class="block text-center w-full py-3 rounded-xl bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 font-bold transition-all orbitron text-xs tracking-widest text-white uppercase">
                                REGISTER NOW
                            </a>
                        </div>
                    </div>
                `;
            });
        }

        function searchEvents() {
            const term = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allEvents.filter(event => 
                event.title.toLowerCase().includes(term)
            );
            renderEvents(filtered); 
        }

        loadEvents();
    </script>
</body>
</html>
